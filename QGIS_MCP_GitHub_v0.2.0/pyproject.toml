[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qgis-mcp"
version = "0.2.0"
description = "Vendor-neutral MCP server for controlling visible QGIS Desktop instances."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "QGIS MCP contributors" },
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2.0,<3",
  "platformdirs>=4,<5",
  "pydantic>=2.12,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
release = [
  "build>=1.3,<2",
  "pyinstaller>=6.16,<7",
]

[project.scripts]
qgis-mcp = "qgis_mcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
